name: poc-support-command-authz
on: issue_comment
permissions: {}
jobs:
  exact_shape:
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - name: check for the /support command
        id: command
        uses: xt0rted/slash-command-action@bf51f8f5f4ea3d58abc7eca58f77104182b23e88 # v2.0.0
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          command: support
          reaction: "false"
          allow-edits: "true"
          permission-level: admin
      - name: comment with support text
        if: steps.command.outputs.command-name
        uses: ben-z/actions-comment-on-issue@402eb412a8f396be0d4ac52a823ec7121206cc26 # 1.0.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            Hello, @${{ github.event.issue.user.login }} :wave: :robot:

            You seem to have troubles using Kubernetes and kubeadm.
            Note that our issue trackers **should not** be used for providing support to users.
            There are special channels for that purpose.

            Please see:
            - https://github.com/kubernetes/kubeadm#support
      - name: add support label
        if: steps.command.outputs.command-name
        uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
        with:
          labels: kind/support
      - name: close issue
        if: steps.command.outputs.command-name
        uses: peter-evans/close-issue@a700eac5bf2a1c7a8cb6da0c13f93ed96fd53dbe # v1.0.3

  gate_failure_sim:
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - name: check for the /support command with a token that cannot resolve permission
        id: command
        uses: xt0rted/slash-command-action@bf51f8f5f4ea3d58abc7eca58f77104182b23e88 # v2.0.0
        continue-on-error: true
        with:
          repo-token: ghp_000000000000000000000000000000000000
          command: support
          reaction: "false"
          allow-edits: "true"
          permission-level: admin
      - name: diagnostics
        if: always()
        run: |
          echo "OUTCOME=${{ steps.command.outcome }}"
          echo "CONCLUSION=${{ steps.command.conclusion }}"
          echo "CMDNAME=[${{ steps.command.outputs.command-name }}]"
      - name: downstream gate as in target
        if: steps.command.outputs.command-name
        run: echo "DOWNSTREAM_RAN_AFTER_PERMISSION_FAILURE output=${{ steps.command.outputs.command-name }}"
